[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-pricing-agent"
version = "0.2.0"
description = "Drug Pricing Intelligence Agent on Azure: Databricks medallion pipeline + Foundry agent over public US drug pricing data"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
dpa-ask = "dpa.cli:ask_main"
dpa-eval = "dpa.cli:eval_main"

[project.optional-dependencies]
# The agent + LLMOps layer. Runs without Spark: the agent reads Gold tables with DuckDB.
agent = [
    "duckdb>=1.1",
    "sqlglot>=25",
    "openai>=1.60",
    "azure-identity>=1.17",
    "opentelemetry-sdk>=1.27",
    "azure-monitor-opentelemetry-exporter>=1.0.0b30",
    "pyyaml>=6",
]
dev = [
    "pyspark>=3.5,<4.1",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
