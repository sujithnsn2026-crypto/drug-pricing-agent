[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-pricing-agent"
version = "0.1.0"
description = "Drug Pricing Intelligence Agent on Azure: Databricks medallion pipeline + Foundry agent over public US drug pricing data"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pyspark>=3.5,<4.1",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
