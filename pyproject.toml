[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-pricing-agent"
version = "0.1.0"
description = "Drug Pricing Intelligence Agent on Azure: Databricks medallion pipeline + Foundry agent over public US drug pricing data"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pyspark>=3.5,<4.1",
    "pandas>=2.0",
    "pyarrow>=14",
    "pytest>=8",
    "duckdb>=1.0",
    "fastapi>=0.110",
]
agents = [
    "mcp>=2.3,<3",
    "openai>=1.60",
    "azure-identity>=1.17",
    "sqlglot>=25",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
