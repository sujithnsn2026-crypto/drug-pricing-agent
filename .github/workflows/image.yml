name: image

# Builds the hosted app's container image and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/drug-pricing-agent), tagged with the commit SHA and "latest" on main.
# Free for public packages, so the live demo needs no Azure Container Registry.
on:
  push:
    branches: [main]
    paths: ["src/**", "prompts/**", "config/**", "evals/fixture/**", "pyproject.toml", "Dockerfile", ".dockerignore"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Drug Pricing Intelligence Agent: web UI, Ask agent and MCP endpoint
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name dpa -p 8080:8080 -e DPA_MCP_TOKEN=ci ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp)" = "401"
          curl -fs -X POST localhost:8080/mcp -H 'Authorization: Bearer ci' \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q top_price_changes
      - run: echo "Published \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
